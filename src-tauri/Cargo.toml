[package]
name = "redterm"
version = "1.7.4"
description = "A cross-platform SSH terminal built with Tauri, Svelte, and Rust"
license = "Apache-2.0"
repository = "https://github.com/coderredlab/RedTerm"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "redterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-redterm-android-paste = { path = "plugins/tauri-plugin-redterm-android-paste" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.63.1"
ssh-key = "0.7.0-rc.11"
russh-sftp = "2.4.0"
portable-pty = "0.8"
tokio = { version = "1", features = ["full", "sync"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
parking_lot = "0.12"
log = "0.4"
thiserror = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "4.1.6"
arboard = { version = "3", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
font-kit = "0.14.3"

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-redterm-ios-native = { path = "plugins/tauri-plugin-redterm-ios-native" }

[profile.release]
strip = false
