name: Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate release source
    uses: ./.github/workflows/ci.yml

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: RedTerm-linux-x64
            bundles: "appimage deb"
            paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - os: macos-latest
            artifact: RedTerm-macos-universal
            bundles: "dmg"
            rust_targets: "aarch64-apple-darwin x86_64-apple-darwin"
            target_flag: "--target universal-apple-darwin"
            paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            artifact: RedTerm-windows-x64
            bundles: "msi nsis"
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    name: Build ${{ matrix.artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop installers
        run: bun run desktop:build -- --bundles ${{ matrix.bundles }} ${{ matrix.target_flag }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate desktop release tag
        run: |
          VERSION=$(bun -e 'const config = await Bun.file("src-tauri/tauri.desktop.conf.json").json(); process.stdout.write(config.version)')
          if [[ "$GITHUB_REF_NAME" != "desktop-v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match desktop version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Stage release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=()
          while IFS= read -r CANDIDATE; do
            ASSETS+=("$CANDIDATE")
          done < <(find release-assets -type f)
          if [[ ${#ASSETS[@]} -ne 5 ]]; then
            echo "Expected 5 installer assets, found ${#ASSETS[@]}"
            exit 1
          fi
          for ASSET in "${ASSETS[@]}"; do
            if [[ ! -s "$ASSET" ]]; then
              echo "Release asset $ASSET is empty"
              exit 1
            fi
          done

          if RELEASE_DRAFT=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq ".isDraft"); then
            if [[ "$RELEASE_DRAFT" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already published"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" --draft --generate-notes --verify-tag --title "RedTerm Desktop $VERSION"
          fi

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_COUNT=$(gh release view "$GITHUB_REF_NAME" --json assets --jq ".assets | length")
          if [[ "$ASSET_COUNT" -ne 5 ]]; then
            echo "Expected 5 uploaded assets, found $ASSET_COUNT"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
