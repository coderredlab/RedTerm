name: Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate release source
    uses: ./.github/workflows/ci.yml

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: RedTerm-linux-x64
            bundles: "appimage deb"
            paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/deb/*.deb.sig
          - os: macos-latest
            artifact: RedTerm-macos-universal
            bundles: "dmg app"
            rust_targets: "aarch64-apple-darwin x86_64-apple-darwin"
            target_flag: "--target universal-apple-darwin"
            paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - os: windows-latest
            artifact: RedTerm-windows-x64
            bundles: "msi nsis"
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    name: Build ${{ matrix.artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bun run desktop:build -- --bundles ${{ matrix.bundles }} ${{ matrix.target_flag }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate desktop release tag
        run: |
          VERSION=$(bun -e 'const config = await Bun.file("src-tauri/tauri.desktop.conf.json").json(); process.stdout.write(config.version)')
          if [[ "$GITHUB_REF_NAME" != "desktop-v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match desktop version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Normalize release asset names
        run: |
          cd release-assets
          while IFS= read -r -d '' FILE; do
            DIR=$(dirname "$FILE")
            NAME=$(basename "$FILE")
            CLEAN_NAME="${NAME// /.}"
            if [[ "$NAME" != "$CLEAN_NAME" ]]; then
              mv "$FILE" "$DIR/$CLEAN_NAME"
            fi
          done < <(find . -type f -print0)

      - name: Stage release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=()
          while IFS= read -r CANDIDATE; do
            ASSETS+=("$CANDIDATE")
          done < <(find release-assets -type f)
          if [[ ${#ASSETS[@]} -ne 10 ]]; then
            echo "Expected 10 release assets (5 installers + 5 updater artifacts), found ${#ASSETS[@]}"
            exit 1
          fi
          for ASSET in "${ASSETS[@]}"; do
            if [[ ! -s "$ASSET" ]]; then
              echo "Release asset $ASSET is empty"
              exit 1
            fi
          done

          if RELEASE_DRAFT=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq ".isDraft"); then
            if [[ "$RELEASE_DRAFT" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already published"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" --draft --generate-notes --verify-tag --title "RedTerm Desktop $VERSION"
          fi

      - name: Generate updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APPIMAGE=$(find release-assets -type f -name "*.AppImage" ! -name "*.sig")
          DEB=$(find release-assets -type f -name "*.deb" ! -name "*.sig")
          TAR_GZ=$(find release-assets -type f -name "*.app.tar.gz" ! -name "*.sig")
          SETUP_EXE=$(find release-assets -type f -name "*-setup.exe" ! -name "*.sig")
          for FILE in "$APPIMAGE" "$DEB" "$TAR_GZ" "$SETUP_EXE"; do
            if [[ ! -s "$FILE" ]]; then
              echo "Missing updater artifact: $FILE"
              exit 1
            fi
          done

          VERSION="$VERSION" \
          BASE_URL="https://github.com/coderredlab/RedTerm/releases/download/desktop-v${VERSION}" \
          APPIMAGE_NAME="$(basename "$APPIMAGE")" \
          DEB_NAME="$(basename "$DEB")" \
          TAR_GZ_NAME="$(basename "$TAR_GZ")" \
          SETUP_EXE_NAME="$(basename "$SETUP_EXE")" \
          SIG_LINUX="$(cat "${APPIMAGE}.sig")" \
          SIG_LINUX_DEB="$(cat "${DEB}.sig")" \
          SIG_DARWIN="$(cat "${TAR_GZ}.sig")" \
          SIG_WINDOWS="$(cat "${SETUP_EXE}.sig")" \
          bun -e '
            const env = process.env;
            const platform = (signature: string, url: string) => ({ signature, url });
            const manifest = {
              version: env.VERSION,
              pub_date: new Date().toISOString(),
              platforms: {
                "linux-x86_64": platform(env.SIG_LINUX!, `${env.BASE_URL}/${env.APPIMAGE_NAME}`),
                "linux-x86_64-deb": platform(env.SIG_LINUX_DEB!, `${env.BASE_URL}/${env.DEB_NAME}`),
                "darwin-aarch64": platform(env.SIG_DARWIN!, `${env.BASE_URL}/${env.TAR_GZ_NAME}`),
                "darwin-x86_64": platform(env.SIG_DARWIN!, `${env.BASE_URL}/${env.TAR_GZ_NAME}`),
                "windows-x86_64": platform(env.SIG_WINDOWS!, `${env.BASE_URL}/${env.SETUP_EXE_NAME}`),
              },
            };
            await Bun.write("release-assets/latest.json", JSON.stringify(manifest, null, 2));
          '
          gh release upload "$GITHUB_REF_NAME" release-assets/latest.json --clobber

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_COUNT=$(gh release view "$GITHUB_REF_NAME" --json assets --jq ".assets | length")
          if [[ "$ASSET_COUNT" -ne 11 ]]; then
            echo "Expected 11 uploaded assets (10 release files + latest.json), found $ASSET_COUNT"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
